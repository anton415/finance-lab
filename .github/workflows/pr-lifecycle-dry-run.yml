name: PR lifecycle dry-run

on:
  pull_request_target:
    types: [opened, ready_for_review, converted_to_draft, reopened, closed]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Execute only trusted automation, including for fork PRs.
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Log intended lifecycle state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/workflow_controller.py
