name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - run: npm run test:metrics
      - run: npm run build
      - name: Write CI evidence
        if: always()
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p ci-evidence
          printf '{"tested_sha":"%s","run_id":"%s","run_attempt":"%s","run_url":"%s"}\n' "$TESTED_SHA" "$RUN_ID" "$RUN_ATTEMPT" "$RUN_URL" > ci-evidence/evidence.json
          cat ci-evidence/evidence.json >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}
          path: ci-evidence/evidence.json
